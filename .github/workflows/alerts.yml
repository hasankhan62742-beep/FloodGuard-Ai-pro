# FloodGuard AI — daily flood-risk alert check
# Runs every day at 01:00 UTC = 06:00 PKT (Pakistan time).
# Recomputes flood risk for every subscriber in alerts_subscribers.csv and
# sends WhatsApp (CallMeBot) / Email (SMTP) alerts when risk >= threshold.
#
# REQUIRED GitHub Secrets (repo Settings -> Secrets and variables -> Actions):
#   CALLMEBOT_APIKEY  — CallMeBot WhatsApp API key (see ALERTS_SETUP.md)
#   ALERT_SMTP_USER   — Gmail address used to send alert emails
#   ALERT_SMTP_PASS   — Gmail APP password (not your login password!)
# Optional:
#   ALERT_THRESHOLD   — risk % that triggers an alert (default 60)

name: FloodGuard daily alerts

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC == 06:00 PKT, daily
  workflow_dispatch:       # allow manual "Run workflow" button too

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (with LFS model file)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy joblib requests scikit-learn

      - name: Run alert check
        env:
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          ALERT_SMTP_HOST: smtp.gmail.com
          ALERT_SMTP_PORT: "587"
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASS: ${{ secrets.ALERT_SMTP_PASS }}
          ALERT_THRESHOLD: ${{ secrets.ALERT_THRESHOLD }}
        run: python check_alerts.py

      - name: Upload alert log (artifact, 7-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alerts-log
          path: alerts_log.csv
          retention-days: 7
          if-no-files-found: ignore
